basePath: /api/v1
definitions:
  core.ErrorResponse:
    properties:
      error:
        example: описание ошибки
        type: string
    type: object
  core.Note:
    properties:
      content:
        example: Добавить пример структуры API
        type: string
      createdAt:
        example: "2026-11-05T12:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      title:
        example: Идея для лекции
        type: string
      updatedAt:
        example: "2026-11-05T12:30:00Z"
        type: string
    type: object
  core.NoteCreate:
    properties:
      content:
        example: Текст заметки
        type: string
      title:
        example: Новая заметка
        maxLength: 200
        minLength: 1
        type: string
    type: object
  core.NoteUpdate:
    properties:
      content:
        example: Новый текст
        type: string
      title:
        example: Обновлено
        maxLength: 200
        type: string
    type: object
info:
  contact:
    name: Абдулатифзода Акмал, ЭФМО-0126
    url: https://github.com/akmalabdulatifzoda-gif/pz12-swagger
  description: |-
    Учебный REST API для заметок (CRUD). ПЗ №12 — Swagger/OpenAPI.
    Методы POST, PATCH и DELETE требуют Bearer-токен, если сервер запущен с API_TOKEN.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Notes API
  version: "1.0"
paths:
  /notes:
    get:
      description: Возвращает список заметок с пагинацией и фильтром по заголовку
      operationId: listNotes
      parameters:
      - default: 1
        description: Номер страницы (с 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Размер страницы (1–100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Поиск по title (без учёта регистра)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Общее количество
              type: integer
          schema:
            items:
              $ref: '#/definitions/core.Note'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Список заметок
      tags:
      - notes
    post:
      consumes:
      - application/json
      description: Создаёт новую заметку. Поле title обязательно.
      operationId: createNote
      parameters:
      - description: Данные новой заметки
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/core.NoteCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL созданной заметки
              type: string
          schema:
            $ref: '#/definitions/core.Note'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать заметку
      tags:
      - notes
  /notes/{id}:
    delete:
      operationId: deleteNote
      parameters:
      - description: ID заметки
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить заметку
      tags:
      - notes
    get:
      description: Возвращает данные заметки по идентификатору
      operationId: getNote
      parameters:
      - description: ID заметки
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core.Note'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Получить заметку
      tags:
      - notes
    patch:
      consumes:
      - application/json
      description: Меняет только переданные поля; updatedAt выставляется автоматически
      operationId: patchNote
      parameters:
      - description: ID заметки
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/core.NoteUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core.Note'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить заметку (частично)
      tags:
      - notes
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer ВАШ_ТОКЕН (для демо: Bearer secret)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
